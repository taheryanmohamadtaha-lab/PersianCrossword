name: Build APK
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PersianCrossword-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/PersianCrossword-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PersianCrossword-APK
          path: out/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
